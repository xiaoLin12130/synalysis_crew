[project]
name = "synalysis-crew"
version = "0.1.0"
description = "同花顺交割单分析 + 多智能体（LangGraph + DeepSeek）交易点评"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "streamlit>=1.40",
    "plotly>=5.20",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "akshare>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synalysis_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
